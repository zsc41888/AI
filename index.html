<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZSC-GLM4.5 引领未来</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-light: #818cf8;
            --secondary: #f8fafc;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --error: #ef4444;
            --user-bubble: #4f46e5;
            --ai-bubble: #f1f5f9;
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
            --warning: #f59e0b;
            --cute: #ec4899;
            --sassy: #f97316;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.8s ease-out;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            animation: slideDown 0.8s ease-out;
        }
        
        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            letter-spacing: -0.5px;
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            font-weight: 300;
        }
        
        .app-container {
            display: flex;
            gap: 20px;
            height: 80vh;
            animation: fadeInUp 1s ease-out 0.2s both;
        }
        
        .login-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 400px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
        }
        
        .chat-container {
            flex: 2;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.5s ease;
            opacity: 0;
            transform: translateY(20px);
            visibility: hidden;
        }
        
        .chat-container.active {
            opacity: 1;
            transform: translateY(0);
            visibility: visible;
        }
        
        .login-title {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--text);
            font-weight: 700;
        }
        
        .login-subtitle {
            color: var(--text-light);
            margin-bottom: 30px;
            font-size: 1rem;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
            font-size: 0.9rem;
        }
        
        input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            background: white;
        }
        
        button {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
        
        button:hover::before {
            left: 100%;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .info-box {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border-radius: 12px;
            padding: 20px;
            margin-top: 25px;
            border-left: 4px solid #0ea5e9;
            transition: transform 0.3s ease;
        }
        
        .info-box:hover {
            transform: translateX(5px);
        }
        
        .info-box h3 {
            color: #0369a1;
            margin-bottom: 12px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .info-box ul {
            padding-left: 20px;
            font-size: 0.9rem;
            color: #475569;
        }
        
        .info-box li {
            margin-bottom: 8px;
            position: relative;
        }
        
        .info-box li::before {
            content: "•";
            color: #0ea5e9;
            font-weight: bold;
            display: inline-block;
            width: 1em;
            margin-left: -1em;
        }
        
        .chat-header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.8);
        }
        
        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .chat-header-right {
            display: flex;
            gap: 10px;
        }
        
        .ai-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .chat-title {
            font-size: 1.3rem;
            font-weight: 700;
        }
        
        .chat-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: blink 2s infinite;
        }
        
        .context-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--warning);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .context-count {
            background: white;
            color: var(--warning);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 0;
            scroll-behavior: smooth;
        }
        
        /* 自定义滚动条 */
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .messages-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }
        
        .messages-container::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }
        
        .messages-container::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
        
        .message {
            display: flex;
            max-width: 80%;
            animation: messageAppear 0.5s ease-out;
            transform-origin: center bottom;
        }
        
        @keyframes messageAppear {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .message.user {
            align-self: flex-end;
            animation-delay: 0.1s;
        }
        
        .message.ai {
            align-self: flex-start;
            animation-delay: 0.1s;
        }
        
        .message-bubble {
            padding: 15px 20px;
            border-radius: 20px;
            line-height: 1.5;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            position: relative;
            transition: transform 0.3s ease;
        }
        
        .message-bubble:hover {
            transform: scale(1.02);
        }
        
        .user .message-bubble {
            background: linear-gradient(135deg, var(--user-bubble) 0%, var(--primary-dark) 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .ai .message-bubble {
            background: var(--ai-bubble);
            color: var(--text);
            border-bottom-left-radius: 5px;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        .input-area {
            padding: 20px 25px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 15px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.8);
        }
        
        .message-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid var(--border);
            border-radius: 25px;
            font-size: 16px;
            resize: none;
            height: 55px;
            line-height: 1.5;
            font-family: inherit;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
        }
        
        .message-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            background: white;
        }
        
        .send-button {
            border-radius: 50%;
            width: 55px;
            height: 55px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .new-chat-button {
            background: linear-gradient(135deg, var(--warning) 0%, #d97706 100%);
            border-radius: 12px;
            padding: 10px 15px;
            font-size: 14px;
        }
        
        .new-chat-button:hover {
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }
        
        .settings-button {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            border-radius: 12px;
            padding: 10px 15px;
            font-size: 14px;
        }
        
        .settings-button:hover {
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        
        .hidden {
            display: none !important;
        }
        
        .error-message {
            background: #fef2f2;
            color: var(--error);
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.9rem;
            border-left: 4px solid var(--error);
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .loading {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-light);
            padding: 25px;
            justify-content: center;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.8);
        }
        
        /* 全新的AI思考动画 */
        .ai-thinking {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }
        
        .thinking-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            text-align: center;
        }
        
        .thinking-animation {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid transparent;
            animation: pulse-ring 2s ease-out infinite;
        }
        
        .pulse-ring:nth-child(1) {
            animation-delay: 0s;
            border-top-color: var(--primary);
        }
        
        .pulse-ring:nth-child(2) {
            animation-delay: 0.5s;
            border-right-color: var(--primary-light);
        }
        
        .pulse-ring:nth-child(3) {
            animation-delay: 1s;
            border-bottom-color: var(--primary-dark);
        }
        
        .thinking-center {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            z-index: 2;
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.5);
        }
        
        .floating-dots {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        
        .floating-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            animation: float-dot 3s infinite ease-in-out;
        }
        
        .floating-dot:nth-child(1) {
            top: 10%;
            left: 20%;
            animation-delay: 0s;
            background: var(--primary);
        }
        
        .floating-dot:nth-child(2) {
            top: 20%;
            right: 10%;
            animation-delay: 0.5s;
            background: var(--primary-light);
        }
        
        .floating-dot:nth-child(3) {
            bottom: 15%;
            left: 15%;
            animation-delay: 1s;
            background: var(--primary-dark);
        }
        
        .floating-dot:nth-child(4) {
            bottom: 25%;
            right: 20%;
            animation-delay: 1.5s;
            background: var(--primary);
        }
        
        .floating-dot:nth-child(5) {
            top: 40%;
            left: 5%;
            animation-delay: 2s;
            background: var(--primary-light);
        }
        
        .floating-dot:nth-child(6) {
            top: 5%;
            right: 30%;
            animation-delay: 2.5s;
            background: var(--primary-dark);
        }
        
        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.5;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }
        
        @keyframes float-dot {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0.7;
            }
            25% {
                transform: translateY(-15px) translateX(10px);
                opacity: 1;
            }
            50% {
                transform: translateY(-5px) translateX(15px);
                opacity: 0.7;
            }
            75% {
                transform: translateY(-10px) translateX(-5px);
                opacity: 0.9;
            }
        }
        
        /* 页面动画 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideDown {
            from { 
                opacity: 0;
                transform: translateY(-30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from { 
                opacity: 0;
                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 设置面板样式 */
        .settings-panel {
            position: absolute;
            top: 70px;
            right: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 20px;
            width: 350px;
            z-index: 1000;
            border: 1px solid var(--border);
            transform: translateY(-10px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .settings-panel.active {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }
        
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        
        .settings-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
        }
        
        .close-settings {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .close-settings:hover {
            background: var(--ai-bubble);
            color: var(--text);
        }
        
        .settings-section {
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .model-options, .personality-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .model-option, .personality-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .model-option:hover, .personality-option:hover {
            background: var(--ai-bubble);
            border-color: var(--primary-light);
        }
        
        .model-option.selected, .personality-option.selected {
            background: rgba(79, 70, 229, 0.1);
            border-color: var(--primary);
        }
        
        .personality-option.cute.selected {
            background: rgba(236, 72, 153, 0.1);
            border-color: var(--cute);
        }
        
        .personality-option.sassy.selected {
            background: rgba(249, 115, 22, 0.1);
            border-color: var(--sassy);
        }
        
        .model-radio, .personality-radio {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .model-option.selected .model-radio, .personality-option.selected .personality-radio {
            border-color: var(--primary);
        }
        
        .personality-option.cute.selected .personality-radio {
            border-color: var(--cute);
        }
        
        .personality-option.sassy.selected .personality-radio {
            border-color: var(--sassy);
        }
        
        .model-radio::after, .personality-radio::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        
        .model-option.selected .model-radio::after, .personality-option.selected .personality-radio::after {
            opacity: 1;
        }
        
        .personality-option.cute.selected .personality-radio::after {
            background: var(--cute);
        }
        
        .personality-option.sassy.selected .personality-radio::after {
            background: var(--sassy);
        }
        
        .model-info, .personality-info {
            flex: 1;
        }
        
        .model-name, .personality-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
        }
        
        .model-iq, .personality-desc {
            font-size: 0.8rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .iq-value {
            font-weight: 700;
            color: var(--primary);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
                height: auto;
            }
            
            .login-card {
                max-width: 100%;
                padding: 30px;
            }
            
            .message {
                max-width: 90%;
            }
            
            .chat-container {
                height: 70vh;
            }
            
            .header h1 {
                font-size: 2.2rem;
            }
            
            .chat-header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            
            .chat-header-right {
                align-self: flex-end;
            }
            
            .thinking-animation {
                width: 100px;
                height: 100px;
            }
            
            .settings-panel {
                width: 90%;
                right: 5%;
                top: 80px;
            }
        }
        
        /* 打字机效果 */
        .typewriter {
            overflow: hidden;
            border-right: 2px solid var(--primary);
            white-space: nowrap;
            animation: typing 3.5s steps(40, end), blink-caret 0.75s step-end infinite;
        }
        
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: var(--primary) }
        }
        
        /* 流式输出样式 */
        .streaming-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--primary);
            margin-left: 4px;
            animation: streaming 1.5s infinite ease-in-out;
        }
        
        .streaming-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .streaming-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes streaming {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ZSC-GLM4.5</h1>
            <p>⭐引领未来的AI大模型⭐</p>
        </div>
        
        <div class="app-container">
            <div class="login-card" id="loginCard">
                <h2 class="login-title">🎁欢迎使用</h2>
                <p class="login-subtitle">请输入用户密钥链接AI</p>
                
                <div class="form-group">

                        <li>大模型训练耗费1美刀💀</li>
                        <li>AI交流/获取用户密钥-加入QQ群:1070356813</li>

            <div class="chat-container" id="chatContainer">

    <!-- 设置面板 -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-header">
            <h3 class="settings-title">AI模型设置</h3>
            <button class="close-settings" id="closeSettings">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="settings-section">
            <h4 class="section-title">
                <i class="fas fa-brain"></i>
                AI模型选择(默认/推荐GLM)
            </h4>
            <div class="model-options" id="modelOptions">
                <!-- 模型选项将通过JavaScript动态生成 -->
            </div>
        </div>
        
        <div class="settings-section">
            <h4 class="section-title">
                <i class="fas fa-user"></i>
                AI人设设置
            </h4>
            <div class="personality-options" id="personalityOptions">
                <!-- 人设选项将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const loginCard = document.getElementById('loginCard');
            const chatContainer = document.getElementById('chatContainer');
            const userKeyInput = document.getElementById('userKey');
            const loginButton = document.getElementById('loginButton');
            const loginError = document.getElementById('loginError');
            const messageInput = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendButton');
            const messagesContainer = document.getElementById('messagesContainer');
            const loadingDiv = document.getElementById('loading');
            const newChatButton = document.getElementById('newChatButton');
            const contextCount = document.getElementById('contextCount');
            const settingsButton = document.getElementById('settingsButton');
            const settingsPanel = document.getElementById('settingsPanel');
            const closeSettings = document.getElementById('closeSettings');
            const modelOptions = document.getElementById('modelOptions');
            const personalityOptions = document.getElementById('personalityOptions');
            
            // AI模型配置
            const aiModels = [
                { id: 'qwen3-30b-a3b', name: 'free:Qwen3-30B-A3B', iq: 55, selected: false },
                { id: 'qwq-32b', name: 'Qwen/QwQ-32B', iq: 60, selected: false },
                { id: 'glm-4-5', name: 'zai-org/GLM-4.5', iq: 30, selected: true }, // 默认选中
                { id: 'qwen3-vl-32b-thinking', name: 'Qwen/Qwen3-VL-32B-Thinking', iq: 50, selected: false }
            ];
            
            // AI人设配置
            const aiPersonalities = [
                { 
                    id: 'default', 
                    name: '默认型', 
                    description: '标准AI助手，专业友好',
                    prompt: '请使用中文与用户交流，你叫zscGLM4.5模型，由zsc科技开发的AI大模型，与用户的每句话后都必须加上表情',
                    selected: true,
                    style: 'default'
                },
                { 
                    id: 'cute', 
                    name: '可爱型', 
                    description: '感情细腻真实超级可爱',
                    prompt: '请使用中文与用户交流，你叫zscGLM4.5模型，由zsc科技开发的AI大模型，与用户的每句话后都必须加上可爱表情或颜文字，感情细腻真实必须超级可爱必须超级可爱',
                    selected: false,
                    style: 'cute'
                },
                { 
                    id: 'sassy', 
                    name: '怼人型', 
                    description: '语言冷酷怼人，语句嘲讽',
                    prompt: '请使用中文与用户交流，你叫zscGLM4.5模型，由zsc科技开发的AI大模型，与用户的每句话后都必须加上表情，语言冷酷怼人，语句必须全是嘲讽，所有人都怼不过你',
                    selected: false,
                    style: 'sassy'
                }
            ];
            
            // API配置
            let apiConfig = {
                apiKey: "sk-d98gmmyUuxmbfsJrfdzHNKi5UYsQEG50q7bfpyw9mb1MXZMD",
                apiUrl: "https://api.suanli.cn/v1/chat/completions",
                modelName: "zai-org/GLM-4.5", // 默认模型
                personality: 'default' // 默认人设
            };
            
            // 对话历史管理
            let conversationHistory = [];
            let contextLength = 0;
            const maxContextLength = 10; // 最大上下文长度
            
            // 流式输出相关变量
            let currentStreamingMessage = null;
            let currentStreamingBubble = null;
            let streamingController = null;
            
            // 初始化设置
            function initializeSettings() {
                // 从本地存储加载模型设置
                const savedModel = localStorage.getItem('zscSelectedModel');
                if (savedModel) {
                    apiConfig.modelName = savedModel;
                }
                
                // 从本地存储加载人设设置
                const savedPersonality = localStorage.getItem('zscSelectedPersonality');
                if (savedPersonality) {
                    apiConfig.personality = savedPersonality;
                }
                
                // 更新模型选中状态
                aiModels.forEach(model => {
                    model.selected = model.name === apiConfig.modelName;
                });
                
                // 更新人设选中状态
                aiPersonalities.forEach(personality => {
                    personality.selected = personality.id === apiConfig.personality;
                });
                
                // 渲染模型选项
                renderModelOptions();
                
                // 渲染人设选项
                renderPersonalityOptions();
            }
            
            // 渲染模型选项
            function renderModelOptions() {
                modelOptions.innerHTML = '';
                
                aiModels.forEach(model => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = `model-option ${model.selected ? 'selected' : ''}`;
                    optionDiv.setAttribute('data-model', model.name);
                    
                    optionDiv.innerHTML = `
                        <div class="model-radio"></div>
                        <div class="model-info">
                            <div class="model-name">${model.name}</div>
                            <div class="model-iq">
                                <i class="fas fa-brain"></i>
                                <span>智商: <span class="iq-value">${model.iq}</span></span>
                            </div>
                        </div>
                    `;
                    
                    optionDiv.addEventListener('click', () => {
                        selectModel(model.name);
                    });
                    
                    modelOptions.appendChild(optionDiv);
                });
            }
            
            // 渲染人设选项
            function renderPersonalityOptions() {
                personalityOptions.innerHTML = '';
                
                aiPersonalities.forEach(personality => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = `personality-option ${personality.style} ${personality.selected ? 'selected' : ''}`;
                    optionDiv.setAttribute('data-personality', personality.id);
                    
                    optionDiv.innerHTML = `
                        <div class="personality-radio"></div>
                        <div class="personality-info">
                            <div class="personality-name">${personality.name}</div>
                            <div class="personality-desc">${personality.description}</div>
                        </div>
                    `;
                    
                    optionDiv.addEventListener('click', () => {
                        selectPersonality(personality.id);
                    });
                    
                    personalityOptions.appendChild(optionDiv);
                });
            }
            
            // 选择模型
            function selectModel(modelName) {
                // 更新模型选中状态
                aiModels.forEach(model => {
                    model.selected = model.name === modelName;
                });
                
                // 更新API配置
                apiConfig.modelName = modelName;
                
                // 保存到本地存储
                localStorage.setItem('zscSelectedModel', modelName);
                
                // 重新渲染模型选项
                renderModelOptions();
                
                // 显示确认消息
                showTemporaryMessage(`已切换到模型: ${modelName} ⚡`, 'success');
                
                // 关闭设置面板
                settingsPanel.classList.remove('active');
            }
            
            // 选择人设
            function selectPersonality(personalityId) {
                // 更新人设选中状态
                aiPersonalities.forEach(personality => {
                    personality.selected = personality.id === personalityId;
                });
                
                // 更新API配置
                apiConfig.personality = personalityId;
                
                // 保存到本地存储
                localStorage.setItem('zscSelectedPersonality', personalityId);
                
                // 重新渲染人设选项
                renderPersonalityOptions();
                
                // 获取选中的人设
                const selectedPersonality = aiPersonalities.find(p => p.id === personalityId);
                
                // 显示确认消息
                showTemporaryMessage(`已切换到${selectedPersonality.name}人设 🎭`, 'success');
                
                // 关闭设置面板
                settingsPanel.classList.remove('active');
            }
            
            // 获取当前人设的系统提示
            function getSystemPrompt() {
                const selectedPersonality = aiPersonalities.find(p => p.id === apiConfig.personality);
                return selectedPersonality ? selectedPersonality.prompt : aiPersonalities[0].prompt;
            }
            
            // 检查本地存储中是否有保存的用户密钥，并自动填充
            const savedUserKey = localStorage.getItem('zscUserKey');
            if (savedUserKey) {
                userKeyInput.value = savedUserKey;
            }
            
            // 登录按钮点击事件
            loginButton.addEventListener('click', function() {
                const userKey = userKeyInput.value.trim();
                
                if (!userKey) {
                    showLoginError('请输入用户密钥');
                    return;
                }
                
                if (userKey !== 'zsc41888') {
                    showLoginError('用户密钥不正确!请重新输入!😡');
                    return;
                }
                
                // 保存用户密钥到本地存储
                localStorage.setItem('zscUserKey', userKey);
                
                // 添加过渡动画
                loginCard.style.opacity = '0';
                loginCard.style.transform = 'translateX(-50px)';
                
                setTimeout(() => {
                    loginCard.classList.add('hidden');
                    chatContainer.classList.add('active');
                    messageInput.focus();
                }, 500);
            });
            
            // 发送消息函数
            async function sendMessage() {
                const userMessage = messageInput.value.trim();
                
                if (!userMessage) {
                    return;
                }
                
                // 添加用户消息到界面和对话历史
                addMessage(userMessage, 'user');
                addToConversationHistory('user', userMessage);
                messageInput.value = '';
                startThinkingAnimation();
                sendButton.disabled = true;
                
                try {
                    // 准备请求数据，包含上下文
                    const requestData = {
                        model: apiConfig.modelName,
                        messages: [
                            {
                                role: "system",
                                content: getSystemPrompt()
                            },
                            ...conversationHistory
                        ],
                        stream: true  // 启用流式输出
                    };
                    
                    // 创建AbortController以便可以取消请求
                    streamingController = new AbortController();
                    
                    // 发送API请求
                    const response = await fetch(apiConfig.apiUrl, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiConfig.apiKey}`,
                            'Content-Type': 'application/json',
                            'Accept': 'text/event-stream'
                        },
                        body: JSON.stringify(requestData),
                        signal: streamingController.signal
                    });
                    
                    if (!response.ok) {
                        let errorMsg = `HTTP错误: ${response.status} ${response.statusText}`;
                        try {
                            const errorData = await response.json();
                            errorMsg += `\n${JSON.stringify(errorData, null, 2)}`;
                        } catch (e) {
                            // 忽略解析错误
                        }
                        throw new Error(errorMsg);
                    }
                    
                    // 创建AI消息气泡
                    currentStreamingMessage = '';
                    const aiMessageDiv = document.createElement('div');
                    aiMessageDiv.className = 'message ai';
                    
                    currentStreamingBubble = document.createElement('div');
                    currentStreamingBubble.className = 'message-bubble';
                    currentStreamingBubble.innerHTML = '<span class="streaming-dot"></span><span class="streaming-dot"></span><span class="streaming-dot"></span>';
                    
                    aiMessageDiv.appendChild(currentStreamingBubble);
                    messagesContainer.appendChild(aiMessageDiv);
                    
                    // 滚动到底部
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    
                    // 处理流式响应
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        
                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n');
                        
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const data = line.slice(6);
                                if (data === '[DONE]') {
                                    break;
                                }
                                
                                try {
                                    const parsed = JSON.parse(data);
                                    if (parsed.choices && parsed.choices[0] && parsed.choices[0].delta && parsed.choices[0].delta.content) {
                                        currentStreamingMessage += parsed.choices[0].delta.content;
                                        currentStreamingBubble.textContent = currentStreamingMessage;
                                        
                                        // 滚动到底部
                                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                                    }
                                } catch (e) {
                                    // 忽略解析错误
                                }
                            }
                        }
                    }
                    
                    // 流式输出完成
                    addToConversationHistory('assistant', currentStreamingMessage);
                    currentStreamingMessage = null;
                    currentStreamingBubble = null;
                    streamingController = null;
                    
                } catch (error) {
                    console.error('请求失败:', error);
                    
                    // 如果流式输出正在进行，则显示错误消息
                    if (currentStreamingBubble) {
                        const errorMessage = '⚠️网络/连接发生错误!⚠️😭';
                        currentStreamingBubble.textContent = errorMessage;
                        addToConversationHistory('assistant', errorMessage);
                        currentStreamingMessage = null;
                        currentStreamingBubble = null;
                    } else {
                        const errorMessage = '⚠️网络/连接发生错误!⚠️😭';
                        addMessage(errorMessage, 'ai');
                        addToConversationHistory('assistant', errorMessage);
                    }
                    
                    // 取消请求
                    if (streamingController) {
                        streamingController.abort();
                        streamingController = null;
                    }
                } finally {
                    stopThinkingAnimation();
                    sendButton.disabled = false;
                    messageInput.focus();
                }
            }
            
            // 添加消息到聊天界面
            function addMessage(content, sender) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${sender}`;
                
                const bubbleDiv = document.createElement('div');
                bubbleDiv.className = 'message-bubble';
                bubbleDiv.textContent = content;
                
                messageDiv.appendChild(bubbleDiv);
                messagesContainer.appendChild(messageDiv);
                
                // 滚动到底部
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
            
            // 添加到对话历史
            function addToConversationHistory(role, content) {
                conversationHistory.push({
                    role: role,
                    content: content
                });
                
                // 限制上下文长度
                if (conversationHistory.length > maxContextLength * 2) {
                    // 保留最新的对话，移除最旧的
                    conversationHistory = conversationHistory.slice(-maxContextLength * 2);
                }
                
                // 更新上下文计数
                contextLength = Math.floor(conversationHistory.length / 2);
                contextCount.textContent = contextLength;
            }
            
            // 开始新对话
            function startNewConversation() {
                // 清空对话历史
                conversationHistory = [];
                contextLength = 0;
                contextCount.textContent = contextLength;
                
                // 清空消息容器
                messagesContainer.innerHTML = '';
                
                // 添加欢迎消息
                const welcomeMessage = '您好！我是由zsc科技开发的大模型-zscGLM4.5，你可以向我发送消息对话';
                addMessage(welcomeMessage, 'ai');
                addToConversationHistory('assistant', welcomeMessage);
                
                // 显示提示
                showTemporaryMessage('已开始新对话，上下文已清空🤔', 'success');
            }
            
            // 显示临时消息
            function showTemporaryMessage(message, type) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ai`;
                
                const bubbleDiv = document.createElement('div');
                bubbleDiv.className = 'message-bubble';
                bubbleDiv.style.background = type === 'success' ? '#f0fdf4' : '#fef2f2';
                bubbleDiv.style.color = type === 'success' ? '#065f46' : '#991b1b';
                bubbleDiv.style.borderLeft = `4px solid ${type === 'success' ? '#10b981' : '#ef4444'}`;
                bubbleDiv.textContent = message;
                
                messageDiv.appendChild(bubbleDiv);
                messagesContainer.appendChild(messageDiv);
                
                // 滚动到底部
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                
                // 3秒后移除消息
                setTimeout(() => {
                    messageDiv.remove();
                }, 3000);
            }
            
            // 显示登录错误信息
            function showLoginError(message) {
                loginError.textContent = message;
                loginError.classList.remove('hidden');
                
                // 3秒后自动移除错误信息
                setTimeout(() => {
                    loginError.classList.add('hidden');
                }, 3000);
            }
            
            // AI思考动画
            function startThinkingAnimation() {
                loadingDiv.classList.remove('hidden');
            }
            
            function stopThinkingAnimation() {
                loadingDiv.classList.add('hidden');
            }
            
            // 设置面板控制
            function toggleSettingsPanel() {
                settingsPanel.classList.toggle('active');
            }
            
            // 事件监听器
            sendButton.addEventListener('click', sendMessage);
            newChatButton.addEventListener('click', startNewConversation);
            settingsButton.addEventListener('click', toggleSettingsPanel);
            closeSettings.addEventListener('click', toggleSettingsPanel);
            
            // 点击设置面板外部关闭面板
            document.addEventListener('click', function(event) {
                if (!settingsPanel.contains(event.target) && !settingsButton.contains(event.target) && settingsPanel.classList.contains('active')) {
                    settingsPanel.classList.remove('active');
                }
            });
            
            // 输入框回车发送
            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            // 登录输入框回车登录
            userKeyInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    loginButton.click();
                }
            });
            
            // 输入框获取焦点
            if (loginCard.classList.contains('hidden')) {
                messageInput.focus();
            } else {
                userKeyInput.focus();
            }
            
            // 初始添加欢迎消息到对话历史
            const welcomeMessage = '您好！我是由zsc科技开发的大模型-zscGLM4.5，你可以向我发送消息对话';
            addToConversationHistory('assistant', welcomeMessage);
            
            // 初始化设置
            initializeSettings();
        });
    </script>
</body>
