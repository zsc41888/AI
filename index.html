<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZSC科技丨ZSC-GLM4.5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* -----------------------------------------------------------
           🌌 SYSTEM: AETHER DESIGN LANGUAGE
           ----------------------------------------------------------- */
        :root {
            /* 调色板：深空与霓虹 */
            --void-bg: #050505;
            --void-panel: rgba(20, 20, 20, 0.6);
            --void-border: rgba(255, 255, 255, 0.08);
            
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1, #a855f7);
            --primary-glow: rgba(99, 102, 241, 0.4);
            
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            
            /* 物理动效曲线 - 极度丝滑 */
            --ease-elastic: cubic-bezier(0.68, -0.6, 0.32, 1.6);
            --ease-expo: cubic-bezier(0.19, 1, 0.22, 1);
            
            --glass: blur(20px) saturate(180%);
            
            /* ZSC动画变量 */
            --zsc-primary-bg: #0a0a12;
            --zsc-accent-color: #00e5ff;
            --zsc-text-primary: #ffffff;
            --zsc-transition-fast: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* 全局重置 */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--void-bg);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }
        
        /* 防止入场动画期间滚动 */
        body.no-scroll {
            overflow: hidden;
            height: 100vh;
        }
        
        /* -----------------------------------------------------------
           🚀 ZSC科技入场动画 - 与111.html完全一致
           ----------------------------------------------------------- */
        /* 3D立方体容器 */
        #cube-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1001;
            overflow: hidden;
            perspective: 1000px;
            pointer-events: none;
        }
        
        #cube {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300px;
            height: 300px;
            margin: -150px 0 0 -150px;
            transform-style: preserve-3d;
            animation: rotateCube 30s infinite linear;
        }
        
        .cube-face {
            position: absolute;
            width: 300px;
            height: 300px;
            background: transparent;
            border: 2px solid rgba(0, 229, 255, 0.6);
            box-shadow: inset 0 0 40px rgba(0, 229, 255, 0.3), 
                        0 0 40px rgba(0, 229, 255, 0.2);
            opacity: 0.8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: rgba(0, 229, 255, 0.3);
        }
        
        /* 立方体六个面 */
        .cube-face.front  { transform: translateZ(150px); }
        .cube-face.back   { transform: rotateY(180deg) translateZ(150px); }
        .cube-face.right  { transform: rotateY(90deg) translateZ(150px); }
        .cube-face.left   { transform: rotateY(-90deg) translateZ(150px); }
        .cube-face.top    { transform: rotateX(90deg) translateZ(150px); }
        .cube-face.bottom { transform: rotateX(-90deg) translateZ(150px); }
        
        /* 添加内部连接线 */
        .cube-face::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent;
            box-shadow: 
                0 0 0 1px rgba(0, 229, 255, 0.3),
                0 0 30px rgba(0, 229, 255, 0.1) inset;
        }
        
        @keyframes rotateCube {
            0% { transform: rotateX(-20deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(-20deg) rotateY(360deg) rotateZ(360deg); }
        }
        
        /* 入场动画容器 */
        .zsc-entry-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--zsc-primary-bg);
            z-index: 1002;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: opacity 1s ease, visibility 1s ease;
        }
        
        .zsc-entry-animation.hidden {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }
        
        /* 背景动画 */
        .zsc-bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: 
                linear-gradient(rgba(18, 18, 31, 0.9) 1px, transparent 1px),
                linear-gradient(90deg, rgba(18, 18, 31, 0.9) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
            animation: zsc-gridMove 20s linear infinite;
        }
        
        @keyframes zsc-gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }
        
        /* Logo动画容器 */
        .zsc-logo-animation {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .zsc-logo-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(0, 229, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 30px;
            animation: zsc-pulse 3s infinite alternate;
        }
        
        .zsc-logo-circle::before, .zsc-logo-circle::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 2px solid var(--zsc-accent-color);
            opacity: 0;
        }
        
        .zsc-logo-circle::before {
            width: 160px;
            height: 160px;
            animation: zsc-ripple 3s infinite 0.5s;
        }
        
        .zsc-logo-circle::after {
            width: 200px;
            height: 200px;
            animation: zsc-ripple 3s infinite 1s;
        }
        
        .zsc-logo-text {
            font-size: 3rem;
            font-weight: 700;
            color: var(--zsc-text-primary);
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.7);
            position: relative;
            overflow: hidden;
        }
        
        .zsc-logo-text span {
            color: var(--zsc-accent-color);
        }
        
        .zsc-logo-text::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.3), transparent);
            animation: zsc-shine 3s infinite;
        }
        
        /* 标语动画 */
        .zsc-slogan {
            font-size: 1.5rem;
            margin-top: 30px;
            text-align: center;
            color: #a0a0b0;
            opacity: 0;
            transform: translateY(20px);
            animation: zsc-fadeInUp 1.5s forwards 1s;
        }
        
        /* 进度指示器 */
        .zsc-progress-container {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 40px;
            overflow: hidden;
            position: relative;
            opacity: 0;
            animation: zsc-fadeIn 1s forwards 1.5s;
        }
        
        .zsc-progress-bar {
            height: 100%;
            width: 0%;
            background: var(--zsc-accent-color);
            border-radius: 2px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--zsc-accent-color);
        }
        
        /* 跳过按钮 */
        .zsc-skip-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #a0a0b0;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: var(--zsc-transition-fast);
            z-index: 3;
        }
        
        .zsc-skip-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--zsc-text-primary);
        }
        
        /* 动画关键帧 */
        @keyframes zsc-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.4);
            }
            70% {
                box-shadow: 0 0 0 30px rgba(0, 229, 255, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(0, 229, 255, 0);
            }
        }
        
        @keyframes zsc-ripple {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }
        
        @keyframes zsc-shine {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }
        
        @keyframes zsc-fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes zsc-fadeIn {
            to {
                opacity: 1;
            }
        }
        
        /* -----------------------------------------------------------
           🌆 背景：噪点 + 动态极光 (原index.html背景)
           ----------------------------------------------------------- */
        .ambient-bg {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% -20%, #1e1b4b, #000);
        }
        
        .ambient-bg::after {
            content: ""; position: absolute; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        .aurora {
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg at 50% 50%, rgba(99, 102, 241, 0.1), transparent 40%, rgba(168, 85, 247, 0.1) 60%, transparent 100%);
            animation: aurora-spin 20s linear infinite;
            filter: blur(80px);
            opacity: 0.6;
        }

        /* -----------------------------------------------------------
           🧊 UI 组件：玻璃态卡片 (原index.html内容)
           ----------------------------------------------------------- */
        .app-wrapper {
            width: 100%; max-width: 1200px; height: 100%;
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .app-wrapper.visible {
            opacity: 1;
        }

        /* 登录面板 */
        .login-panel {
            width: 90%; max-width: 380px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: var(--glass);
            -webkit-backdrop-filter: var(--glass);
            border: 1px solid var(--void-border);
            border-radius: 32px;
            padding: 48px 32px;
            display: flex; flex-direction: column; gap: 24px;
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.8);
            transform: translateZ(0);
            transition: all 0.8s var(--ease-expo);
        }

        .brand-title {
            font-size: 2rem; font-weight: 700; letter-spacing: -1px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .brand-subtitle { font-size: 0.9rem; color: var(--text-secondary); letter-spacing: 0.5px; }

        .input-group { position: relative; width: 100%; }
        
        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--void-border);
            border-radius: 20px;
            padding: 20px 24px;
            color: white; font-size: 1rem;
            transition: all 0.3s var(--ease-expo);
        }
        
        input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            transform: scale(1.02);
        }

        .btn-primary {
            background: var(--text-primary);
            color: #000;
            border: none;
            border-radius: 20px;
            padding: 20px;
            font-weight: 600; font-size: 1rem;
            cursor: pointer;
            transition: all 0.4s var(--ease-expo);
            position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center; gap: 12px;
        }

        .btn-primary:hover { transform: scale(1.03); box-shadow: 0 10px 30px rgba(255,255,255,0.15); }
        .btn-primary:active { transform: scale(0.96); }

        .meta-info {
            background: rgba(255,255,255,0.02);
            border-radius: 16px; padding: 16px;
            font-size: 0.8rem; color: var(--text-secondary); line-height: 1.6;
        }

        /* -----------------------------------------------------------
           💬 聊天界面：流体布局
           ----------------------------------------------------------- */
        .chat-interface {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            background: var(--void-panel);
            backdrop-filter: blur(40px);
            opacity: 0; pointer-events: none;
            transform: scale(0.95) translateY(20px);
            transition: all 0.8s var(--ease-expo);
        }

        .chat-interface.active { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }

        @media (min-width: 768px) {
            .chat-interface {
                inset: 40px; border-radius: 32px; border: 1px solid var(--void-border);
                box-shadow: 0 50px 100px -20px rgba(0,0,0,0.7);
            }
        }

        /* 顶部栏 */
        .chat-header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--void-border);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5, 5, 5, 0.8);
            z-index: 10;
        }

        .ai-status { display: flex; align-items: center; gap: 16px; }
        .avatar-glow {
            width: 44px; height: 44px; border-radius: 14px;
            background: var(--primary-gradient);
            position: relative;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: white;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }
        .avatar-glow::after {
            content: ""; position: absolute; inset: -2px; border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .status-text h3 { font-size: 1rem; margin-bottom: 2px; letter-spacing: 0.5px; }
        .status-badge { font-size: 0.75rem; color: #4ade80; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 6px; height: 6px; background: currentColor; border-radius: 50%; animation: pulse-dot 2s infinite; }

        /* 消息区域 */
        .scroll-area {
            flex: 1; overflow-y: auto; padding: 32px;
            display: flex; flex-direction: column; gap: 32px;
            scroll-behavior: smooth;
        }
        
        /* 隐藏滚动条但保留功能 */
        .scroll-area::-webkit-scrollbar { width: 6px; }
        .scroll-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .message {
            max-width: 80%;
            animation: slide-up 0.6s var(--ease-expo) forwards;
            opacity: 0; transform: translateY(20px);
        }
        
        .message.user { align-self: flex-end; }
        .message.ai { align-self: flex-start; }

        .bubble {
            padding: 18px 24px; border-radius: 24px;
            font-size: 1rem; line-height: 1.6; letter-spacing: 0.3px;
            position: relative;
        }

        .user .bubble {
            background: var(--primary-gradient);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .ai .bubble {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        /* 底部输入栏 */
        .input-dock {
            padding: 24px 32px;
            background: rgba(5, 5, 5, 0.9);
            border-top: 1px solid var(--void-border);
            display: flex; gap: 16px; align-items: flex-end;
        }

        .glass-input {
            flex: 1; min-height: 56px; max-height: 120px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--void-border);
            border-radius: 28px;
            padding: 16px 24px;
            color: white; font-size: 1rem; line-height: 1.5;
            resize: none; font-family: inherit;
            transition: all 0.3s;
        }
        
        .glass-input:focus { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.2); }

        .send-trigger {
            width: 56px; height: 56px; border-radius: 50%;
            background: white; color: black; border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; cursor: pointer;
            transition: all 0.3s var(--ease-expo);
        }
        
        .send-trigger:hover { transform: scale(1.1) rotate(-10deg); }
        .send-trigger:active { transform: scale(0.9); }

        /* -----------------------------------------------------------
           ⚛️ 核心：NEURAL ORB 思考动画
           ----------------------------------------------------------- */
        .thinking-engine {
            padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 24px;
            animation: fade-in 0.5s ease-out;
        }

        .orb-container {
            position: relative; width: 80px; height: 80px;
            display: flex; justify-content: center; align-items: center;
        }

        /* 核心光球 */
        .orb-core {
            width: 20px; height: 20px; background: white; border-radius: 50%;
            box-shadow: 0 0 40px 10px rgba(255,255,255,0.5);
            z-index: 10;
            animation: orb-breathe 2s ease-in-out infinite;
        }

        /* 轨道环 1 */
        .orb-ring {
            position: absolute; inset: 0; border-radius: 50%;
            border: 1px solid transparent;
            border-top-color: var(--primary);
            border-right-color: rgba(168, 85, 247, 0.5);
            animation: orb-spin 3s linear infinite;
            filter: blur(1px);
        }

        /* 轨道环 2 (液态) */
        .orb-fluid {
            position: absolute; inset: -10px; border-radius: 50%;
            background: conic-gradient(from 180deg, transparent, rgba(6, 182, 212, 0.4), transparent);
            animation: orb-spin-reverse 5s linear infinite;
            filter: blur(8px); mix-blend-mode: screen;
        }

        .thinking-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem; letter-spacing: 2px; color: var(--text-secondary);
            text-transform: uppercase;
            display: flex; gap: 4px;
        }
        
        .dot { animation: jump 1.5s infinite; }
        .dot:nth-child(2) { animation-delay: 0.1s; }
        .dot:nth-child(3) { animation-delay: 0.2s; }

        /* -----------------------------------------------------------
           🔧 设置浮层
           ----------------------------------------------------------- */
        .settings-overlay {
            position: absolute; top: 80px; right: 20px; width: 300px;
            background: rgba(15, 15, 20, 0.95);
            border: 1px solid var(--void-border);
            border-radius: 24px; padding: 8px;
            transform-origin: top right;
            transform: scale(0.9) translateY(-10px); opacity: 0; pointer-events: none;
            transition: all 0.4s var(--ease-expo);
            z-index: 100;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .settings-overlay.active { opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }

        .menu-item {
            padding: 16px; border-radius: 16px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: 0.2s;
            color: var(--text-secondary); font-size: 0.9rem;
        }
        
        .menu-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .menu-item.active { background: rgba(99, 102, 241, 0.1); color: var(--primary); }

        .hidden { display: none !important; }

        /* 动画关键帧 */
        @keyframes aurora-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes orb-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes orb-spin-reverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
        @keyframes orb-breathe { 0%, 100% { transform: scale(0.8); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } }
        @keyframes slide-up { to { opacity: 1; transform: translateY(0); } }
        @keyframes jump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .login-panel { width: 100%; border-radius: 0; height: 100%; border: none; justify-content: center; }
            .chat-interface { border-radius: 0; border: none; }
            .chat-header, .input-dock { padding: 16px 20px; }
            .scroll-area { padding: 20px; }
            .message { max-width: 90%; }
            
            /* ZSC动画移动端适配 */
            .zsc-logo-text { font-size: 2.2rem; }
            .zsc-slogan { font-size: 1.2rem; }
            
            #cube {
                width: 200px;
                height: 200px;
                margin: -100px 0 0 -100px;
            }
            
            .cube-face {
                width: 200px;
                height: 200px;
                font-size: 2.5rem;
            }
            
            .cube-face.front  { transform: translateZ(100px); }
            .cube-face.back   { transform: rotateY(180deg) translateZ(100px); }
            .cube-face.right  { transform: rotateY(90deg) translateZ(100px); }
            .cube-face.left   { transform: rotateY(-90deg) translateZ(100px); }
            .cube-face.top    { transform: rotateX(90deg) translateZ(100px); }
            .cube-face.bottom { transform: rotateX(-90deg) translateZ(100px); }
        }
    </style>
</head>
<body class="no-scroll">
    <!-- 🚀 ZSC科技入场动画 (与111.html完全相同) -->
    <!-- 3D立方体背景 -->
    <div id="cube-container">
        <div id="cube">
            <div class="cube-face front"><i class="fas fa-cube"></i></div>
            <div class="cube-face back"><i class="fas fa-atom"></i></div>
            <div class="cube-face right"><i class="fas fa-code"></i></div>
            <div class="cube-face left"><i class="fas fa-cogs"></i></div>

    <!-- 🌆 原index.html内容 -->
    <div class="ambient-bg">
        <div class="aurora"></div>

    <div class="app-wrapper" id="appWrapper">
        <div class="login-panel" id="loginCard">
            <div>
                <h1 class="brand-title">GLM4.5</h1>
                <p class="brand-subtitle">ZSC-GLM4.5 plus 品质至上</p>
            </div>
            
            <div class="input-group">

            <button class="btn-primary" id="loginButton">

            <div class="meta-info">

                    <span>延迟</span>

                </div>
                <div style="margin-top:12px; border-top:1px solid rgba(255,255,255,0.1); padding-top:8px;">
                    免费获取密钥: QQ群 1070356813
                </div>

            <div id="loginError" style="color:#ef4444; font-size:0.9rem; text-align:center; display:none;">Error: Invalid Key</div>

        <div class="chat-interface" id="chatContainer">
            <div class="chat-header">
                <div class="ai-status">
                    <div class="avatar-glow">

                    <div class="status-text">

                        <div class="status-badge"><div class="status-dot"></div> 在线</div>

                <div style="display:flex; gap:12px;">
                    <button id="settingsBtn" style="background:transparent; border:none; color:white; font-size:1.1rem; cursor:pointer;"><i class="fas fa-sliders-h"></i></button>
                    <button id="resetBtn" style="background:transparent; border:none; color:white; font-size:1.1rem; cursor:pointer;"><i class="fas fa-redo-alt"></i></button>
                </div>
            </div>

            <div class="scroll-area" id="msgContainer">
                <div class="message ai">

                        系统连接成功。AETHER 引擎已就绪，等待指令。
                    </div>

            <div id="loading" class="thinking-engine hidden">
                <div class="orb-container">
                    <div class="orb-core"></div>
                    <div class="orb-ring"></div>
                    <div class="orb-fluid"></div>

            <div class="input-dock">

    <div class="settings-overlay" id="settingsPanel">
        <div style="padding:16px; font-size:0.8rem; color:#666; text-transform:uppercase; letter-spacing:1px;">AI丨模型</div>
        <div id="modelList"></div>
        <div style="padding:16px 16px 8px 16px; font-size:0.8rem; color:#666; text-transform:uppercase; letter-spacing:1px; border-top:1px solid rgba(255,255,255,0.05); margin-top:8px;">AI丨人格</div>
        <div id="personaList"></div>
    </div>

    <script>
        // 加密配置中心
        const CONFIG = {
            //编码后的API密钥（原密钥：sb还想看？）
            encryptedApiKey: "c2stZDk4Z21teVV1eG1iZnNKcmZkekhOS2k1VVlzUUVHNTBxN2JmcHl3OW1iMU1YWk1E",
            //编码后的登录密钥（原密钥：zsc41888）
            encryptedLoginKey: "enNjNDE4ODg=",
            endpoint: "https://api.suanli.cn/v1/chat/completions",
            defaultModel: "zai-org/GLM-4.5"
        };

        // 解密函数
        function decryptBase64(encoded) {
            return atob(encoded);
        }

        // 动态获取解密后的API密钥
        function getApiKey() {
            return decryptBase64(CONFIG.encryptedApiKey);
        }

        // 动态获取解密后的登录密钥
        function getLoginKey() {
            return decryptBase64(CONFIG.encryptedLoginKey);
        }

        const STATE = {
            model: "zai-org/GLM-4.5",
            persona: "default",
            history: [],
            isTyping: false
        };

        const DATA = {
            models: [
                { id: 'zai-org/GLM-4.5', name: 'GLM-4.5 巅峰模型' },
                { id: 'Qwen/QwQ-32B', name: 'QwQ-32B 智能' },
                { id: 'free:Qwen3-30B-A3B', name: 'Qwen3-30B 思考' }
            ],
            personas: [
                { id: 'default', name: '标准', prompt: '请使用中文与用户交流，你叫zscGLM4.5模型，由zsc科技开发的AI大模型，与用户的每句话后都必须加上表情' },
                { id: 'cute', name: '可爱', prompt: '请使用中文与用户交流...语言可爱细腻真实每句话必须加上可爱的颜文字或表情'},
                { id: 'hacker', name: '硬核嘲讽', prompt: '你是一个超级高傲的ai，谁都要嘲讽，你看不起任何人，语言刺激嘲讽恶毒每次对话都要配上嘲讽的表情(不是颜文字)' }
            ]
        };

        // DOM 元素引用
        const $ = (id) => document.getElementById(id);
        const UI = {
            login: $('loginCard'),
            chat: $('chatContainer'),
            keyInput: $('userKey'),
            loginBtn: $('loginButton'),
            err: $('loginError'),
            msgList: $('msgContainer'),
            input: $('msgInput'),
            send: $('sendBtn'),
            loading: $('loading'),
            settings: $('settingsPanel'),
            setBtn: $('settingsBtn'),
            rstBtn: $('resetBtn'),
            mList: $('modelList'),
            pList: $('personaList'),
            // ZSC动画元素
            entryAnimation: $('zscEntryAnimation'),
            progressBar: $('zscProgressBar'),
            skipBtn: $('zscSkipBtn'),
            appWrapper: $('appWrapper'),
            cubeContainer: $('cube-container')
        };

        // 显示登录页面函数
        function showLoginPage() {
            // 隐藏入场动画
            UI.entryAnimation.classList.add('hidden');
            
            // 隐藏3D立方体背景
            UI.cubeContainer.style.opacity = '0';
            setTimeout(() => {
                UI.cubeContainer.style.display = 'none';
            }, 1000);
            
            // 显示主页面并允许滚动
            document.body.classList.remove('no-scroll');
            UI.appWrapper.classList.add('visible');
            
            // 确保入场动画完全隐藏后，不影响页面交互
            setTimeout(() => {
                UI.entryAnimation.style.display = 'none';
            }, 1000);
        }

        // ZSC入场动画初始化
        function initZscAnimation() {
            // 模拟加载进度
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += Math.random() * 10;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(progressInterval);
                    
                    // 进度完成后，显示登录页面
                    setTimeout(() => {
                        showLoginPage();
                    }, 500);
                }
                UI.progressBar.style.width = `${progress}%`;
            }, 100);
            
            // 跳过按钮
            UI.skipBtn.addEventListener('click', function() {
                clearInterval(progressInterval);
                showLoginPage();
            });
            
            // 3D立方体背景响应窗口大小调整
            function adjustCubeSize() {
                const cube = document.getElementById('cube');
                const windowWidth = window.innerWidth;
                
                // 根据窗口大小调整立方体尺寸
                if (windowWidth < 480) {
                    cube.style.width = '200px';
                    cube.style.height = '200px';
                    cube.style.margin = '-100px 0 0 -100px';
                    
                    document.querySelectorAll('.cube-face').forEach(face => {
                        face.style.width = '200px';
                        face.style.height = '200px';
                    });
                } else {
                    cube.style.width = '300px';
                    cube.style.height = '300px';
                    cube.style.margin = '-150px 0 0 -150px';
                    
                    document.querySelectorAll('.cube-face').forEach(face => {
                        face.style.width = '300px';
                        face.style.height = '300px';
                    });
                }
            }
            
            // 初始调整立方体大小
            adjustCubeSize();
            
            // 窗口大小改变时调整立方体大小
            window.addEventListener('resize', adjustCubeSize);
        }

        // 初始化原index.html功能
        function initChatApp() {
            const savedKey = localStorage.getItem('zsc_key');
            if (savedKey) UI.keyInput.value = savedKey;

            renderSettings();
            bindEvents();
        }

        function bindEvents() {
            UI.loginBtn.onclick = handleLogin;
            UI.send.onclick = handleSend;
            UI.setBtn.onclick = (e) => { e.stopPropagation(); UI.settings.classList.toggle('active'); };
            UI.rstBtn.onclick = resetContext;
            
            // 关闭设置点击外部
            document.onclick = (e) => {
                if (!UI.settings.contains(e.target) && e.target !== UI.setBtn) {
                    UI.settings.classList.remove('active');
                }
            };

            // 回车发送 (Shift+Enter 换行)
            UI.input.onkeydown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            };
        }

        // 渲染设置菜单
        function renderSettings() {
            UI.mList.innerHTML = DATA.models.map(m => `
                <div class="menu-item ${STATE.model === m.id ? 'active' : ''}" onclick="setModel('${m.id}')">
                    <span>${m.name}</span>
                    ${STATE.model === m.id ? '<i class="fas fa-check"></i>' : ''}
                </div>
            `).join('');

            UI.pList.innerHTML = DATA.personas.map(p => `
                <div class="menu-item ${STATE.persona === p.id ? 'active' : ''}" onclick="setPersona('${p.id}')">
                    <span>${p.name}</span>
                    ${STATE.persona === p.id ? '<i class="fas fa-check"></i>' : ''}
                </div>
            `).join('');
        }

        window.setModel = (id) => { STATE.model = id; renderSettings(); };
        window.setPersona = (id) => { STATE.persona = id; renderSettings(); };

        // 登录逻辑
        function handleLogin() {
            const key = UI.keyInput.value.trim();
            const validKey = getLoginKey(); // 获取解密后的登录密钥
            
            if (key !== validKey) {
                UI.err.style.display = 'block';
                UI.keyInput.style.borderColor = '#ef4444';
                return;
            }
            
            localStorage.setItem('zsc_key', key);
            
            // 进场动画
            UI.login.style.transform = 'scale(0.9) translateY(-20px)';
            UI.login.style.opacity = '0';
            
            setTimeout(() => {
                UI.login.style.display = 'none';
                UI.chat.classList.add('active');
                UI.input.focus();
            }, 600);
        }

        // 发送消息核心逻辑
        async function handleSend() {
            const text = UI.input.value.trim();
            if (!text || STATE.isTyping) return;

            // UI 更新
            addMessage(text, 'user');
            UI.input.value = '';
            UI.input.style.height = '56px'; // 重置高度
            UI.loading.classList.remove('hidden');
            STATE.isTyping = true;
            scrollToBottom();

            // 构建请求上下文
            STATE.history.push({ role: 'user', content: text });
            // 保持最近 12 条记录以节省 Token
            const context = STATE.history.slice(-12);
            const sysPrompt = DATA.personas.find(p => p.id === STATE.persona).prompt;

            try {
                const response = await fetch(CONFIG.endpoint, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${getApiKey()}`, // 使用解密后的API密钥
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: STATE.model,
                        messages: [{ role: 'system', content: sysPrompt }, ...context],
                        stream: true
                    })
                });

                if (!response.ok) throw new Error('Network response was not ok');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let aiText = '';
                let bubble = createMessageElement('ai'); // 创建空的 AI 气泡

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.slice(6));
                                const delta = data.choices[0]?.delta?.content || '';
                                aiText += delta;
                                bubble.innerText = aiText; // 实时更新文本
                                scrollToBottom();
                            } catch (e) { console.error('Parse error', e); }
                        }
                    }
                }

                STATE.history.push({ role: 'assistant', content: aiText });

            } catch (error) {
                addMessage('Link Connection Failed. Please retry.', 'ai');
            } finally {
                UI.loading.classList.add('hidden');
                STATE.isTyping = false;
            }
        }

        // DOM 操作辅助
        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = `<div class="bubble">${text}</div>`;
            UI.msgList.appendChild(div);
            scrollToBottom();
        }

        function createMessageElement(type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            div.appendChild(bubble);
            UI.msgList.appendChild(div);
            return bubble;
        }

        function scrollToBottom() {
            UI.msgList.scrollTop = UI.msgList.scrollHeight;
        }

        function resetContext() {
            STATE.history = [];
            UI.msgList.innerHTML = '';
            addMessage('记忆已清空，开启你的新对话', 'ai');
        }

        // 启动 - 先初始化ZSC动画，动画结束后初始化聊天应用
        document.addEventListener('DOMContentLoaded', function() {
            initZscAnimation();
            
            // 在动画结束后初始化聊天应用
            setTimeout(() => {
                initChatApp();
            }, 3000); // 3秒后初始化，确保动画完全展示
        });
    </script>
</body>
